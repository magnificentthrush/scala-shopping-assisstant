$kind: http-request
url: http://localhost:8080/api/conversations/{{conversationId}}
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{vault:test_token}}
body:
  type: json
  content: '{"title":"Waterproof hiking shoes"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 400
