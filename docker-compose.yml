## Docker containerizes the app tiers only: frontend + backend.
## PostgreSQL is NOT containerized — the app connects to hosted Supabase
## Postgres (shared dev database) via SUPABASE_URL / SUPABASE_KEY.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      GEMMA_API_KEY: ${GEMMA_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_LOGGING: ${LLM_LOGGING:-true}
    volumes:
      - ./backend:/app
      - sbt_cache:/root/.sbt
      - ivy2_cache:/root/.ivy2
      - coursier_cache:/root/.cache/coursier
    command:
      - sh
      - -c
      - |
        echo ""
        echo "  ShopPilot backend  →  $${BACKEND_URL:-http://localhost:8080}"
        echo "  Health check       →  $${BACKEND_URL:-http://localhost:8080}/health"
        echo "  Frontend           →  $${FRONTEND_URL:-http://localhost:5173}"
        echo ""
        exec sbt "~runMain assistant.Main"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  sbt_cache:
  ivy2_cache:
  coursier_cache:
  frontend_node_modules:
